version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cme-db
    networks:
      - cme-network
    environment:
      POSTGRES_DB: calcmadeeasy
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
    ports: 
      - "5432:5432"  # Comment.
    # Where to save the data in DB
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d calcmadeeasy"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend: 
    build: ./server
    container_name: cme-backend
    networks:
      - cme-network
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
  
  frontend:
    build: ./client
    container_name: cme-frontend
    networks:
      - cme-network
    ports:
      - "5173:80" 
    depends_on:
      - backend

networks:
  cme-network:
    driver: bridge

# Data storage place
volumes:
  postgres_data:
