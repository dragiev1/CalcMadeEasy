<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="100%" height="100%">
  <!-- Background (Optional, remove if you want it transparent) -->
  <rect width="240" height="120" fill="#F8FAFC" rx="16" />

  <!-- LEFT PI: Stressed -->
  <g id="stressed-pi">
    <!-- Pi Body -->
    <path d="M 30 40 L 90 40 M 45 40 L 45 80 M 75 40 L 75 80" 
          stroke="#64748B" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Worried Eyes -->
    <circle cx="48" cy="55" r="4" fill="#1E293B"/>
    <circle cx="72" cy="55" r="4" fill="#1E293B"/>
    
    <!-- Wavy Mouth -->
    <path d="M 52 68 Q 56 64 60 68 T 68 68" 
          stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
          
    <!-- Sweat Drop -->
    <path d="M 95 45 Q 102 55 95 62 Q 88 55 95 45" fill="#38BDF8"/>
  </g>

  <!-- RIGHT PI: Happy -->
  <g id="happy-pi">
    <!-- Pi Body -->
    <path d="M 150 40 L 210 40 M 165 40 L 165 80 M 195 40 L 195 80" 
          stroke="#10B981" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Happy Eyes (^ ^) -->
    <path d="M 162 58 Q 168 52 174 58" 
          stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 186 58 Q 192 52 198 58" 
          stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
          
    <!-- Big Smile -->
    <path d="M 170 68 Q 180 78 190 68" 
          stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
          
    <!-- Blushing Cheeks -->
    <circle cx="160" cy="65" r="4" fill="#F472B6" opacity="0.6"/>
    <circle cx="200" cy="65" r="4" fill="#F472B6" opacity="0.6"/>
  </g>
</svg>