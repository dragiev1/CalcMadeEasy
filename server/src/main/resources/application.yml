# application.yml
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:calcmadeeasy}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: HikariCP

  jpa:
    hibernate:
      ddl-auto: update  # use 'validate' or 'none' in production
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    org.springframework: INFO
    com.calcmadeeasy: DEBUG


google:
  client: 
    id: ${GOOGLE_CLIENT_ID:default-client-id} # Note the ':default-client-id'

jwt:
  secret: ${JWT_SECRET:default_secret_key_that_is_long_enough_to_be_valid_for_hs256}
